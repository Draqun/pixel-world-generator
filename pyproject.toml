[project]
name = "pixel-world-generator"
version = "0.0.0"
description = "Seeded world map generator: 1 px = 1 m"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy==2.3.3"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pixel_world"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
