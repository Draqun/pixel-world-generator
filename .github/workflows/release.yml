name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.9.0'
      - run: uv sync --locked
      - run: npm install --global @fission-ai/openspec@1.14.1
      - name: Validate release prerequisites
        id: release
        run: |
          version=$(make --silent release-check)
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - run: make check
      - name: Prepare changelog and distributions
        run: |
          make --silent changelog-draft > "$RUNNER_TEMP/release-notes.md"
          make changelog-build
          make build
      - name: Publish release commit and tag
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md changelog.d
          git commit -m "chore(release): publish $TAG"
          git tag -a "$TAG" -m "Release $TAG"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$TAG"
      - name: Create GitHub Release with packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
