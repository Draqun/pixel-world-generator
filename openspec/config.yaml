schema: spec-driven

context: |
  Language: en
  All artifacts must be written in en.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: pixel-world-generator, a seeded world map generator (1 px = 1 m), Python 3.13 + numpy.
  Read AGENTS.md first: its determinism rules are binding (same seed + version + parameters =
  byte-identical output; one random stream per step; 16-bit heightmap PNG; data out as PNG + JSON).
  Slices, in order: terrain, water, biomes, settlements, roads and bridges, borders.

